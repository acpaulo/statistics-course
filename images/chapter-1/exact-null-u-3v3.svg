<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Exact null distribution of Mann–Whitney U for three observations per group</title><desc id="desc">Bars show the number of allocations for each U from zero to nine. The two extreme outcomes U equals zero and U equals nine are highlighted. Their combined probability is two out of twenty, or 0.10.</desc>
<rect width="100%" height="100%" rx="14" fill="#ffffff"/><text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#173e68">Exact null distribution of U (3 observations per group)</text>
<line x1="80" y1="300" x2="820" y2="300" stroke="#52677b" stroke-width="1.5"/><line x1="80" y1="55" x2="80" y2="300" stroke="#52677b" stroke-width="1.5"/>
<rect x="90" y="218.3" width="48" height="81.7" rx="5" fill="#c95b54"/><text x="114" y="209.3" text-anchor="middle" font-size="15" fill="#263b50">1</text><text x="114" y="324" text-anchor="middle" font-size="15" fill="#263b50">0</text><rect x="160" y="218.3" width="48" height="81.7" rx="5" fill="#7da6c8"/><text x="184" y="209.3" text-anchor="middle" font-size="15" fill="#263b50">1</text><text x="184" y="324" text-anchor="middle" font-size="15" fill="#263b50">1</text><rect x="230" y="136.7" width="48" height="163.3" rx="5" fill="#7da6c8"/><text x="254" y="127.7" text-anchor="middle" font-size="15" fill="#263b50">2</text><text x="254" y="324" text-anchor="middle" font-size="15" fill="#263b50">2</text><rect x="300" y="55.0" width="48" height="245.0" rx="5" fill="#7da6c8"/><text x="324" y="46.0" text-anchor="middle" font-size="15" fill="#263b50">3</text><text x="324" y="324" text-anchor="middle" font-size="15" fill="#263b50">3</text><rect x="370" y="55.0" width="48" height="245.0" rx="5" fill="#7da6c8"/><text x="394" y="46.0" text-anchor="middle" font-size="15" fill="#263b50">3</text><text x="394" y="324" text-anchor="middle" font-size="15" fill="#263b50">4</text><rect x="440" y="55.0" width="48" height="245.0" rx="5" fill="#7da6c8"/><text x="464" y="46.0" text-anchor="middle" font-size="15" fill="#263b50">3</text><text x="464" y="324" text-anchor="middle" font-size="15" fill="#263b50">5</text><rect x="510" y="55.0" width="48" height="245.0" rx="5" fill="#7da6c8"/><text x="534" y="46.0" text-anchor="middle" font-size="15" fill="#263b50">3</text><text x="534" y="324" text-anchor="middle" font-size="15" fill="#263b50">6</text><rect x="580" y="136.7" width="48" height="163.3" rx="5" fill="#7da6c8"/><text x="604" y="127.7" text-anchor="middle" font-size="15" fill="#263b50">2</text><text x="604" y="324" text-anchor="middle" font-size="15" fill="#263b50">7</text><rect x="650" y="218.3" width="48" height="81.7" rx="5" fill="#7da6c8"/><text x="674" y="209.3" text-anchor="middle" font-size="15" fill="#263b50">1</text><text x="674" y="324" text-anchor="middle" font-size="15" fill="#263b50">8</text><rect x="720" y="218.3" width="48" height="81.7" rx="5" fill="#c95b54"/><text x="744" y="209.3" text-anchor="middle" font-size="15" fill="#263b50">1</text><text x="744" y="324" text-anchor="middle" font-size="15" fill="#263b50">9</text><text x="450" y="354" text-anchor="middle" font-size="15" fill="#52677b">Mann–Whitney U</text><text x="25" y="180" transform="rotate(-90 25 180)" text-anchor="middle" font-size="15" fill="#52677b">Number of allocations</text>
<rect x="620" y="48" width="235" height="56" rx="8" fill="#fff3f0" stroke="#e4b3ad"/><text x="737" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#9d3f39">Two extreme tails</text><text x="737" y="91" text-anchor="middle" font-size="16" fill="#9d3f39">p = (1 + 1) / 20 = 0.10</text>
<rect x="98" y="390" width="13" height="13" rx="2" fill="#c95b54"/><text x="118" y="402" font-size="13" fill="#52677b">Extreme outcomes included in the two-sided p-value</text>
</svg>