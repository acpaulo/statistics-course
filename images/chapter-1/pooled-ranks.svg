<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">Pooled observations and ranks</title><desc id="d">All twelve values are sorted together. Control observations are ranks one to six; antibiotic observations are ranks seven to twelve.</desc><rect width="960" height="300" rx="14" fill="#fff"/><text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#173e68">Pool all 12 observations, sort once, then assign ranks</text><text x="30" y="112" font-size="17" font-weight="700" fill="#315d83">Control</text><text x="30" y="212" font-size="17" font-weight="700" fill="#6c5594">Antibiotic</text><rect x="160" y="72" width="54" height="58" rx="7" fill="#dcecff" stroke="#4e83b3"/><text x="187" y="94" text-anchor="middle" font-size="12" fill="#52677b">rank 1</text><text x="187" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#263b50">0.8</text><rect x="224" y="72" width="54" height="58" rx="7" fill="#dcecff" stroke="#4e83b3"/><text x="251" y="94" text-anchor="middle" font-size="12" fill="#52677b">rank 2</text><text x="251" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#263b50">1.0</text><rect x="288" y="72" width="54" height="58" rx="7" fill="#dcecff" stroke="#4e83b3"/><text x="315" y="94" text-anchor="middle" font-size="12" fill="#52677b">rank 3</text><text x="315" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#263b50">1.1</text><rect x="352" y="72" width="54" height="58" rx="7" fill="#dcecff" stroke="#4e83b3"/><text x="379" y="94" text-anchor="middle" font-size="12" fill="#52677b">rank 4</text><text x="379" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#263b50">1.2</text><rect x="416" y="72" width="54" height="58" rx="7" fill="#dcecff" stroke="#4e83b3"/><text x="443" y="94" text-anchor="middle" font-size="12" fill="#52677b">rank 5</text><text x="443" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#263b50">1.3</text><rect x="480" y="72" width="54" height="58" rx="7" fill="#dcecff" stroke="#4e83b3"/><text x="507" y="94" text-anchor="middle" font-size="12" fill="#52677b">rank 6</text><text x="507" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#263b50">1.4</text><rect x="544" y="72" width="54" height="58" rx="7" fill="#eee7fb" stroke="#8b6ab0"/><text x="571" y="94" text-anchor="middle" font-size="12" fill="#52677b">rank 7</text><text x="571" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#263b50">1.6</text><rect x="608" y="72" width="54" height="58" rx="7" fill="#eee7fb" stroke="#8b6ab0"/><text x="635" y="94" text-anchor="middle" font-size="12" fill="#52677b">rank 8</text><text x="635" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#263b50">1.8</text><rect x="672" y="72" width="54" height="58" rx="7" fill="#eee7fb" stroke="#8b6ab0"/><text x="699" y="94" text-anchor="middle" font-size="12" fill="#52677b">rank 9</text><text x="699" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#263b50">1.9</text><rect x="736" y="72" width="54" height="58" rx="7" fill="#eee7fb" stroke="#8b6ab0"/><text x="763" y="94" text-anchor="middle" font-size="12" fill="#52677b">rank 10</text><text x="763" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#263b50">2.0</text><rect x="800" y="72" width="54" height="58" rx="7" fill="#eee7fb" stroke="#8b6ab0"/><text x="827" y="94" text-anchor="middle" font-size="12" fill="#52677b">rank 11</text><text x="827" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#263b50">2.2</text><rect x="864" y="72" width="54" height="58" rx="7" fill="#eee7fb" stroke="#8b6ab0"/><text x="891" y="94" text-anchor="middle" font-size="12" fill="#52677b">rank 12</text><text x="891" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#263b50">2.4</text><rect x="160" y="157" width="374" height="34" rx="7" fill="#dcecff" stroke="#4e83b3"/><text x="347" y="179" text-anchor="middle" font-size="14" font-weight="700" fill="#315d83">Control ranks 1–6 · rank sum = 21</text><rect x="544" y="157" width="374" height="34" rx="7" fill="#eee7fb" stroke="#8b6ab0"/><text x="731" y="179" text-anchor="middle" font-size="14" font-weight="700" fill="#6c5594">Antibiotic ranks 7–12 · rank sum = 57</text><text x="480" y="250" text-anchor="middle" font-size="15" fill="#52677b">The groups are not ranked separately: every observation is ranked in the pooled set.</text></svg>