<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><rect width="1000" height="600" fill="#f2f6fa"/><text x="500" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#124f7a">Wilcoxon signed-rank test · QUICK RECAP</text><rect x="55" y="100" width="420" height="112" rx="18" fill="#ffffff" stroke="#8da7ba" stroke-width="2"/><text x="77" y="135" font-family="Arial" font-size="19" font-weight="bold" fill="#2d6d9a">BIOLOGICAL DESIGN</text><text x="77" y="176" font-family="Arial" font-size="23" fill="#203247">Paired / matched</text><rect x="525" y="100" width="420" height="112" rx="18" fill="#ffffff" stroke="#8da7ba" stroke-width="2"/><text x="547" y="135" font-family="Arial" font-size="19" font-weight="bold" fill="#2d6d9a">HYPOTHESES</text><text x="547" y="176" font-family="Arial" font-size="23" fill="#203247">Paired differences</text><rect x="55" y="245" width="420" height="112" rx="18" fill="#ffffff" stroke="#8da7ba" stroke-width="2"/><text x="77" y="280" font-family="Arial" font-size="19" font-weight="bold" fill="#2d6d9a">STATISTIC</text><text x="77" y="321" font-family="Arial" font-size="23" fill="#203247">W+ and W−</text><rect x="525" y="245" width="420" height="112" rx="18" fill="#ffffff" stroke="#8da7ba" stroke-width="2"/><text x="547" y="280" font-family="Arial" font-size="19" font-weight="bold" fill="#2d6d9a">R FUNCTION</text><text x="547" y="321" font-family="Arial" font-size="23" fill="#203247">wilcox.test(..., paired=TRUE)</text><rect x="55" y="390" width="420" height="112" rx="18" fill="#ffffff" stroke="#8da7ba" stroke-width="2"/><text x="77" y="425" font-family="Arial" font-size="19" font-weight="bold" fill="#2d6d9a">FOLLOW-UP</text><text x="77" y="466" font-family="Arial" font-size="23" fill="#203247">Paired effect + CI</text><rect x="525" y="390" width="420" height="112" rx="18" fill="#ffffff" stroke="#8da7ba" stroke-width="2"/><text x="547" y="425" font-family="Arial" font-size="19